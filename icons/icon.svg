<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    KasirKu favicon, diturunkan dari logo mark resmi ikon.svg
    (mesin kasir + struk, sudut 16/64 seperti tema-radius).

    Warna dari situs kasirku-sage.vercel.app:
      #6c2bd9  tema-utama / theme-color / isi ikon.svg
      #f5f3ff  layar/struk di ikon.svg (dekat tema-latar #f8f5ff)
      #a778ff  garis kedua di ikon.svg
      #f4b942  tema-aksen / ujung struk di ikon.svg

    Geometri disnap ke kelipatan 4 agar tajam di 16px dan 32px.
    Batang dibuat sama tebal (4 unit) supaya tetap kebaca di 16px.
  -->
  <defs>
    <clipPath id="ikon">
      <rect width="64" height="64" rx="16" ry="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ikon)">
    <rect width="64" height="64" rx="16" ry="16" fill="#6c2bd9"/>
    <rect x="12" y="16" width="40" height="24" rx="4" ry="4" fill="#f5f3ff"/>
    <rect x="16" y="20" width="16" height="4" rx="2" ry="2" fill="#6c2bd9"/>
    <rect x="16" y="28" width="24" height="4" rx="2" ry="2" fill="#a778ff"/>
    <path d="M20 44h24l4 8H16z" fill="#f4b942"/>
  </g>
</svg>
